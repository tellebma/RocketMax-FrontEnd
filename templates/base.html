<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}RocketMax{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Materialize CSS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />

    <!-- Google Icons -->
    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    />

    <!-- Font Awesome (pour icônes Steam/Epic) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="grey lighten-4">

    <!-- NAVBAR -->
    <nav class="blue darken-3">
        <div class="nav-wrapper container">
            <a href="{{ url_for('index') }}" class="brand-logo">
                <i class="material-icons left">sports_esports</i>
                RocketMax
            </a>
        </div>
    </nav>

    <!-- CONTENU -->
    <main class="container section">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="page-footer blue darken-3">
        <div class="container">
            <div class="row">
                <div class="col s12 center-align white-text">
                    RocketMax – suivi MMR &amp; historique de parties
                </div>
            </div>
        </div>
    </footer>

    <!-- Materialize JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
