name: CI/CD – Docker Build & Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Docker metadata generator
    # Generates tags automatically based on the event
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: tellebma/backend-bakkesmod
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=snapshot,enable=${{ github.event_name == 'pull_request' }}
          type=sha,format=short

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Cache Docker layers
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    # Setup Docker Buildx (multi-platform, caching, better build)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true

    # Build & Push
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Move new cache into place
    - name: Update build cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
